[project]
name = "mygoal"
version = "0.1.0"
description = "My Goal, My Plan: a financial stability layer (Finnova hackathon, case 6)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# LLM providers are optional: everything except the free-text agent works without them.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
debug-ui = ["streamlit>=1.38"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mygoal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
