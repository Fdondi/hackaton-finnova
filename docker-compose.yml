services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}             # auto | anthropic | openai | openai_compat | none
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}                                       # cloud OpenAI
      OPENAI_API_MODEL: ${OPENAI_API_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}                  # "" for non-reasoning models
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}   # local model (LM Studio, vLLM)
      OPENAI_MODEL: ${OPENAI_MODEL:-local-model}
      MYGOAL_DATA_SOURCE: ${MYGOAL_DATA_SOURCE:-synthetic}
      MYGOAL_DATA_DIR: ${MYGOAL_DATA_DIR:-/app/data/synthetic}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:                                           # swap data or config without rebuilding
      - ./data:/app/data:ro
      - ./config:/app/config:ro
