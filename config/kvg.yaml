# Swiss basic health insurance (KVG/LAMal) rules. Checked 2026-09-17: deductibles, 70% max discount (KVV Art. 95 Abs. 2bis),
# 10% co-pay capped at 700 (bag.admin.ch 'Wahlfranchisen', 'Prämien und Kostenbeteiligung'). Cost model below is an estimate.
deductibles_adult: [300, 500, 1000, 1500, 2000, 2500]
max_discount_share_of_extra_risk: 0.70   # premium discount <= 70% of (d - 300), i.e. <= CHF 1,540 at 2,500
copay_rate: 0.10
copay_cap_adult: 700
hospital_contribution_per_day: 15
deadlines:
  switch_insurer_or_lower_deductible: "11-30"
  raise_deductible_same_insurer: "12-31"
  premiums_announced: "end of September"

# Annual gross costs billed to basic insurance per adult. ESTIMATES: calibrate against FOPH statistics.
# Mixture: P(no costs) + lognormal for positive costs.
cost_model:
  prior_weight_years: 3     # history weight = n / (n + 3)
  age_bands:
    - {max_age: 25, p_zero: 0.25, median_positive: 700,  sigma: 1.3}
    - {max_age: 35, p_zero: 0.20, median_positive: 900,  sigma: 1.3}
    - {max_age: 45, p_zero: 0.17, median_positive: 1200, sigma: 1.3}
    - {max_age: 55, p_zero: 0.13, median_positive: 1700, sigma: 1.3}
    - {max_age: 65, p_zero: 0.10, median_positive: 2600, sigma: 1.3}
    - {max_age: 200, p_zero: 0.05, median_positive: 4500, sigma: 1.2}
